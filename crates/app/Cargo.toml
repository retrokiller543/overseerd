[package]
name = "upwell-app"
description = "The Upwell protocol-agnostic application core: the App/AppBuilder, the Plugin/Protocol traits, the DI runtime handle, scope planning, lifecycle, and builtins."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true

[features]
default = []
di-check = [
    "upwell-di/di-check",
    "upwell-config/di-check",
]
yaml = ["upwell-config/yaml"]
watch = ["upwell-config/watch"]
tracing-subscriber = ["dep:tracing-subscriber"]

[dependencies]
upwell-core = { workspace = true }
upwell-di = { workspace = true }
upwell-hooks = { workspace = true }
upwell-config = { workspace = true }
upwell-dirs = { workspace = true }
upwell-macros = { workspace = true }
tokio = { workspace = true }
futures = { workspace = true }
serde = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, optional = true }
thiserror = { workspace = true }
