# Base configuration. `${VAR}` resolves an environment variable (uppercase) or a
# config path (dotted/lowercase); `${VAR:default}` falls back when unset. A full
# `${VAR}` leaf coerces to the target type; an embedded one (e.g. the addr below)
# can only produce a string. `${@kind}` resolves an application directory
# (`@config @data @cache @state @runtime @tmp`) from the DirectoriesManager.

# Homeledger's base config is merged with `application-development.toml` by the
# declaration's generated parser default environment. Explicit `--environment` and
# `UPWELL_PROFILES` replace that default; later repeated profiles win in order.
[logging]
level = "info,homeledger=debug,upwell=info"
ansi = false

[homeledger.ledger]
household = "Maple Street"
currency = "USD"

# Supplied by the compliance policy replacing Homeledger RPC's household default.
[homeledger.audit]
retention_days = 2555
require_review_ticket = true

[homeledger.server]
port = "${PORT:9000}"
addr = "127.0.0.1:${homeledger.server.port}"
bind = "${BIND:127.0.0.1}"
# `socket` is intentionally omitted — it falls back to its `#[default]`:
# "${@runtime}/homeledger.sock".

# Internally tagged (`kind = ".."`): selects the `disk` variant but omits its `path`, so
# the field falls back to its `#[default]` of "${@data}/blobs". Omit this section entirely
# (or set `kind = "memory"`) to get the `#[default]` `Memory` variant.
[homeledger.storage]
kind = "disk"

[homeledger.database.reader]
url = "postgres://${DB_HOST:localhost}:5432/homeledger"
pool_size = "${READER_POOL:8}"

[homeledger.database.writer]
url = "postgres://${DB_HOST:localhost}:5432/homeledger"
pool_size = "${WRITER_POOL:4}"
